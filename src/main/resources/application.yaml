spring:
  application:
    name: bootcamp

  spring:
    rabbitmq:
      host: localhost
      port: 5672
      username: bootcamp
      password: "1234"

  r2dbc:
    url: r2dbc:postgresql://localhost:5434/bootcamp
    username: postgres
    password: 1234

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5434/bootcamp
    user: postgres
    password: 1234

springdoc:
  swagger-ui:
    path: "/api/doc/bootcamp/swagger-ui.html"
  api-docs:
    path: "/api/doc/bootcamp/api-docs"

server:
  port: 8082

queue:
  rabbitmq:
    name-queue: "report.create.bootcamp"

routes:
  paths:
    bootcamps: "/api/v1/bootcamps"
    bootcamps-list: "/api/v1/bootcamps/list"
    delete-bootcamp-by-id: "/api/v1/bootcamps/{bootcampId}"
    validate-conflicts: "/api/v1/bootcamps/{id}/conflicts"

adapter:
  clients:
    timeout: 5000
    clients:
      capability:
        base-url: "http://localhost:8081/api/v1"
      tech:
        base-url: "http://localhost:8080/api/v1"