spring:
  application:
    name: bootcamp

  r2dbc:
    url: r2dbc:postgresql://localhost:5434/bootcamp
    username: postgres
    password: 1234

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5434/bootcamp
    user: postgres
    password: 1234

springdoc:
  swagger-ui:
    path: "/api/doc/bootcamp/swagger-ui.html"
  api-docs:
    path: "/api/doc/bootcamp/api-docs"

server:
  port: 8082

routes:
  paths:
    bootcamps: "/api/v1/bootcamps"

adapter:
  clients:
    timeout: 5000
    clients:
      capability:
        base-url: "http://localhost:8081/api/v1"